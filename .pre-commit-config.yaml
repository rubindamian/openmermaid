# See https://pre-commit.com for more information
# Python hooks follow ehr-bridge (django-upgrade 6.0, black, isort, flake8)
# plus integrations-style codespell. Frontend hooks target frontend/ (U6+).

default_language_version:
    python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/adamchainz/django-upgrade
    rev: "1.29.1"
    hooks:
      - id: django-upgrade
        args: [--target-version, "6.0"]

  - repo: local
    hooks:
      - id: isort
        name: isort
        language: python
        entry: isort
        additional_dependencies: [isort]
        types: [python]
        files: '(tests|studio|config)/.*\.py$'

      - id: black
        name: black
        language: python
        entry: black --target-version py313
        additional_dependencies: [black]
        types: [python]
        files: '(tests|studio|config)/.*\.py$'

      - id: flake8
        name: flake8
        language: python
        entry: flake8
        additional_dependencies: [flake8]
        types: [python]
        files: '(tests|studio|config)/.*\.py$'

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude: |
            (?x)^(
                .*\.svg$|
                .*\.lock$|
                frontend/package-lock\.json$
            )$
        args: ["--ignore-words-list", "thirdparty"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/
        exclude: package-lock\.json$
        additional_dependencies:
          - prettier@3.6.2
          - prettier-plugin-svelte@3.4.0
          - svelte@5

  - repo: local
    hooks:
      - id: svelte-check
        name: svelte-check
        language: system
        pass_filenames: false
        files: ^frontend/
        entry: bash -c 'cd frontend && npm run check'
