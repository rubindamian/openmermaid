[flake8]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,.venv,venv
per-file-ignores =
    tests/*:F811
    config/settings/*.py:F401,F403

[pycodestyle]
max-line-length = 120
exclude = .tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules,.venv,venv

[isort]
profile = black
line_length = 88
known_first_party = studio,config
multi_line_output = 3
default_section = THIRDPARTY
skip = .venv,venv
skip_glob = **/migrations/*.py
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool:black]
line-length = 88
target-version = py313
